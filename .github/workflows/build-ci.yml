name: CI
on:
  push:
    branches:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn clean verify -Psonar sonar:sonar -Dsonar.projectKey=${{ secrets.SONAR_PROJECT }} -Dsonar.host.url=${{ secrets.SONAR_HOST }} -Dsonar.token=${{ secrets.SONAR_TOKEN }}
    - name: Check SonarQube Quality Gate
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST: ${{ secrets.SONAR_HOST }}
        SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT }}
      run: |
        echo "Checking SonarQube Quality Gate status..."
        # Recupera lo stato del Quality Gate
        STATUS=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY" | jq -r '.projectStatus.status')
        echo "Quality Gate Status: $STATUS"

        if [ "$STATUS" != "OK" ]; then
          echo "Quality Gate failed! Failing the build."
          exit 1
        fi