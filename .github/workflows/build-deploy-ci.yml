name: CI
on:
  push:
    tags:
      - '**'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn package dockerfile:push -Pdocker -Drelease.version=$(echo $(echo ${{github.ref_name}} | sed s/release-//))
      - name: Remove File
        uses: JesseTG/rm@v1.0.3
        with:
          path: src/main/resources/release-note/*
    if: startsWith(github.ref_name, 'release-')
  build-app-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: src/main/web/fantabet-app
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 16.13.0
        uses: actions/setup-node@v3
        with:
          node-version: 16.13.0
      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: | 
          pwd          
          npm ci
      - name: Build
        run: |
          pwd   
          npm run app
      - name: Sync app
        run: |
          pwd  
          npx cap sync
      - name: set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Create google-service.json
        id: createGoogleServices
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_JSON_BASE_64 }}" | base64 -d > android/app/google-services.json
      - name: Check google-services.json presence
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ google-services.json FOUND"
            if grep -q '"current_key"' android/app/google-services.json; then
              echo "✅ google-services.json contains current_key"
            else
              echo "❌ google-services.json does NOT contain expected content"
              exit 1
            fi
          else
            echo "❌ google-services.json NOT FOUND"
            exit 1
          fi
      - name: Build with Gradle
        run: |
          cd android
          ./gradlew build
      - name: Build Release AAB
        id: buildRelease
        run:  |
          cd android
          ./gradlew bundleRelease
      - name: Upload AAB
        id: uploadArtifact
        uses: actions/upload-artifact@v4
        with:
          name: fantabet-app
          path: src/main/web/fantabet-app/android/app/build/outputs/bundle/release/fantabet-app-release.aab
      - name: Create service_account.json
        id: createServiceAccount
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json
          pwd
          ls
      - name: Deploy to Play Store
        id: deploy
        uses: r0adkll/upload-google-play@v1.0.15
        if: ${{ !contains(github.ref_name, '-5-') }}
        with:
          serviceAccountJson: src/main/web/fantabet-app/service_account.json
          packageName: it.fantabet.app
          releaseFiles: src/main/web/fantabet-app/android/app/build/outputs/bundle/release/fantabet-app-release.aab
          inAppUpdatePriority: 0
      - name: Deploy with priority to Play Store
        id: deploy-with-priority
        uses: r0adkll/upload-google-play@v1.0.15
        if: ${{ contains(github.ref_name, '-5-') }}
        with:
          serviceAccountJson: src/main/web/fantabet-app/service_account.json
          packageName: it.fantabet.app
          releaseFiles: src/main/web/fantabet-app/android/app/build/outputs/bundle/release/fantabet-app-release.aab
          inAppUpdatePriority: 5
    if: startsWith(github.ref_name, 'releaseApp-')