databaseChangeLog:
  - changeSet:
      id: add-travel-user-id-to-specialcategories-travel
      author: alessandro.fazari
      changes:
        - addColumn:
            tableName: specialcategories_travels
            columns:
              - column:
                  name: travel_user_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: specialcategories_travels
            baseColumnNames: travel_user_id
            referencedTableName: travels_users
            referencedColumnNames: id
            constraintName: fk_specialcategories_travel_travel_user
            onDelete: SET NULL

  - changeSet:
      id: add-reviewed-to-travel
      author: alessandro.fazari
      changes:
        - addColumn:
            tableName: travel
            columns:
              - column:
                  name: reviewed
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
