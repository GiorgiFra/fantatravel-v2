databaseChangeLog:
  - changeSet:
      id: 7
      author: alessandro.fazari
      changes:
        - createTable:
            tableName: category
            schemaName: fantatravel
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false