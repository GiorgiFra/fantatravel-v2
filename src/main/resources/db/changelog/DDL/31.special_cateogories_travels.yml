databaseChangeLog:
  - changeSet:
      id: 20250815-1
      author: fantatravel
      changes:
        - createTable:
            tableName: specialcategories_travels
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: travel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: special_category_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: specialcategories_travels
            baseColumnNames: travel_id
            referencedTableName: travel
            referencedColumnNames: id
            constraintName: fk_specialcategories_travels_travel
        - addForeignKeyConstraint:
            baseTableName: specialcategories_travels
            baseColumnNames: special_category_id
            referencedTableName: special_category
            referencedColumnNames: id
            constraintName: fk_specialcategories_travels_special_category
