databaseChangeLog:
  - changeSet:
      id: 21.update-teams-users-to-travel-user
      author: alessandro.fazari
      changes:
        # 1. Rimuovo vincolo esistente teams_users → user
        - dropForeignKeyConstraint:
            baseTableName: teams_users
            constraintName: fk_teams_users_user

        # 2. Rimuovo eventuale unique team_id,user_id
        - dropUniqueConstraint:
            tableName: teams_users
            constraintName: unique_team_user

        # 3. Rimuovo colonna user_id
        - dropColumn:
            tableName: teams_users
            columnName: user_id

        # 4. Aggiungo nuova colonna travel_user_id
        - addColumn:
            tableName: teams_users
            columns:
              - column:
                  name: travel_user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        # 5. Creo nuovo foreign key verso travels_users
        - addForeignKeyConstraint:
            baseTableName: teams_users
            baseColumnNames: travel_user_id
            constraintName: fk_teams_users_traveluser
            referencedTableName: travels_users
            referencedColumnNames: id
            onDelete: CASCADE

        # 6. Ricreo unique per evitare duplicati team-travel_user
        - addUniqueConstraint:
            tableName: teams_users
            columnNames: team_id, travel_user_id
            constraintName: unique_team_traveluser
