databaseChangeLog:
  - changeSet:
      id: 20250817-1
      author: alessandro.fazari
      changes:
        - createTable:
            tableName: specialcategories_teams
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: team_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: special_category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: travel_user_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: specialcategories_teams
            baseColumnNames: team_id
            referencedTableName: team
            referencedColumnNames: id
            constraintName: fk_specialcategories_teams_travel
        - addForeignKeyConstraint:
            baseTableName: specialcategories_teams
            baseColumnNames: special_category_id
            referencedTableName: specialcategories_travels
            referencedColumnNames: id
            constraintName: fk_specialcategories_teams_special_category
        - addForeignKeyConstraint:
            baseTableName: specialcategories_teams
            baseColumnNames: travel_user_id
            referencedTableName: travels_users
            referencedColumnNames: id
            constraintName: fk_specialcategories_teams_travel_user
