databaseChangeLog:
  - changeSet:
      id: 5
      author: alessandro.fazari
      changes:
        - createTable:
            tableName: travels_users
            schemaName: fantatravel
            columns:
              - column:
                  name: travel_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    referencedTableName: travel
                    referencedColumnNames: id
                    foreignKeyName: fk_travels_users_travel
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    referencedTableName: user
                    referencedColumnNames: id
                    foreignKeyName: fk_travels_users_user
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false